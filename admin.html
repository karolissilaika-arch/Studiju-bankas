<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panelė | StudijųBankas</title>
<link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div class="dashboard-layout">
        <aside class="sidebar-nav">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <div class="logo">Studijų<span>Bankas</span></div>
            </a>
            <nav id="main-nav">
                <a href="dashboard.html" id="nav-home"><i class="fas fa-home"></i> Pradžia</a>
                <a href="topics.html" id="nav-topics"><i class="fas fa-book"></i> Temos</a>
                <a href="quizzes.html" id="nav-quizzes"><i class="fas fa-vial"></i> Testai</a>
                <a href="exam-prep.html" class="active"><i class="fas fa-graduation-cap"></i> Egzaminai</a>
                <a href="profile.html" id="nav-profile"><i class="fas fa-user"></i> Profilis</a>
                <hr>
                <div id="auth-section"></div>
            </nav>
        </aside>

        <!-- Pagrindinis turinis -->
        <main class="dashboard-main">
            <header class="dash-header">
                <h2>Turinio valdymas</h2>
            </header>

            <!-- 1 SEKCIJA: Esamo turinio valdymas -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px;">
                <section>
                    <h3>Egzistuojančios pamokos</h3>
                    <div id="admin-topics-list" class="course-item" style="display: block; max-height: 300px; overflow-y: auto;">
                        <p>Kraunama...</p>
                    </div>
                </section>
                <section>
                    <h3>Egzistuojantys testai</h3>
                    <div id="admin-quizzes-list" class="course-item" style="display: block; max-height: 300px; overflow-y: auto;">
                        <p>Kraunama...</p>
                    </div>
                </section>
                <section class="admin-card" style="margin-top: 30px; background: white; padding: 30px; border-radius: 15px;">
    <h3>Esami egzaminų klausimai</h3>
    <div id="admin-exam-list" style="margin-top: 15px;">
        </div>
</section>
            </div>

            <hr style="margin-bottom: 30px; border: 0; border-top: 1px solid #eee;">
<section class="admin-card" style="background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-top: 30px;">
    <h3><i class="fas fa-plus-circle"></i> Pridėti Egzamino Klausimą</h3>
    <hr>
    <form id="exam-question-form">
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px;">
            <div>
                <label>Klasė</label>
                <select id="exam-grade" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
                    <option value="11">11 klasė</option>
                    <option value="12">12 klasė</option>
                    <option value="10">10 klasė</option>
                </select>
            </div>
            <div>
                <label>Dalykas (Kategorija)</label>
                <input type="text" id="exam-category" placeholder="Pvz: Matematika" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
            </div>
            <div>
                <label>Tema</label>
                <input type="text" id="exam-topic" placeholder="Pvz: Išvestinės" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;">
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label>Klausimo tekstas</label>
            <textarea id="exam-q-text" rows="3" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;"></textarea>
        </div>

        <div id="exam-options-container" style="margin-bottom: 15px;">
            <label>Atsakymai (pažymėkite teisingą)</label>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                <input type="radio" name="correct-opt" value="0" checked>
                <input type="text" class="exam-opt" placeholder="Atsakymas A" required style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
            </div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                <input type="radio" name="correct-opt" value="1">
                <input type="text" class="exam-opt" placeholder="Atsakymas B" required style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
            </div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                <input type="radio" name="correct-opt" value="2">
                <input type="text" class="exam-opt" placeholder="Atsakymas C" required style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
            </div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                <input type="radio" name="correct-opt" value="3">
                <input type="text" class="exam-opt" placeholder="Atsakymas D" required style="flex: 1; padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
            </div>
        </div>
        <div style="margin-bottom: 15px;">
    <label>Paaiškinimas (nebūtina)</label>
    <textarea id="exam-explanation" rows="2" placeholder="Kodėl šis atsakymas teisingas?" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ddd;"></textarea>
</div>

        <button type="submit" style="background: #27ae60; color: white; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%;">
            Išsaugoti klausimą į duomenų bazę
        </button>
    </form>
</section>

            <!-- 2 SEKCIJA: Pamokos forma -->
<h3 id="topic-form-title">Sukurti / Redaguoti pamoką</h3>
<div class="course-item" style="display: block; margin-bottom: 30px;">
    <form id="topicForm">
        <div class="input-group">
            <label>Pavadinimas</label>
            <input type="text" id="topicTitle" required>
        </div>

        <!-- PRIDĖTA: Pamokos kategorija -->
        <div class="input-group" style="margin-top: 10px;">
            <label>Kategorija</label>
            <select id="topicCategory" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; outline: none; cursor: pointer;">
                <option value="bendra">Bendra</option>
                <option value="Matematika">Matematika</option>
                <option value="Istorija">Istorija</option>
                <option value="Fizika">Fizika</option>
                <option value="Lietuvių kalba">Lietuvių kalba</option>
            </select>
        </div>

        <div class="input-group" style="margin-top: 10px;">
            <label>Trumpas aprašymas</label>
            <input type="text" id="topicDesc">
        </div>
        
        <div class="input-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>Pamokos turinys (HTML/Tekstas)</label>
                <button type="button" onclick="insertImageTag()" class="btn-outline" style="padding: 2px 8px; font-size: 12px; margin-bottom: 5px;">
                    <i class="fas fa-image"></i> Įterpti nuotrauką
                </button>
            </div>
            <textarea id="topicContent" rows="10" style="width:100%; border-radius:10px; padding:10px; border:1px solid #ddd; font-family: monospace;"></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn-primary">Skelbti temą</button>
            <button type="button" onclick="resetTopicForm()" class="btn-outline" style="border: none;">Atšaukti</button>
        </div>
    </form>
</div>

<!-- 3 SEKCIJA: Testo forma -->
<h3 id="quiz-form-title">Sukurti / Redaguoti testą</h3>
<div class="course-item" style="display: block;">
    <form id="quizForm">
        <div class="input-group">
            <label>Testo pavadinimas</label>
            <input type="text" id="quizTitle" required>
        </div>

        <!-- PRIDĖTA: Testo kategorija -->
        <div class="input-group" style="margin-top: 10px;">
            <label>Kategorija</label>
            <select id="quizCategory" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; outline: none; cursor: pointer;">
                <option value="bendra">Bendra</option>
                <option value="Matematika">Matematika</option>
                <option value="Istorija">Istorija</option>
                <option value="Fizika">Fizika</option>
            </select>
        </div>

        <div class="input-group" style="margin-top: 10px;">
            <label>Trumpas testo aprašymas</label>
            <input type="text" id="quizDesc" required>
        </div>

        <div id="questions-container"></div>

        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button type="button" onclick="addQuestion()" class="btn-outline">Pridėti klausimą</button>
            <button type="submit" id="save-quiz-btn" class="btn-primary">Išsaugoti testą</button>
            <button type="button" onclick="resetQuizForm()" class="btn-outline" style="border: none;">Valyti</button>
        </div>
    </form>
</div>

    <!-- Bibliotekos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="admin.js"></script>
</body>
</html>
