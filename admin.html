<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panelė | StudijųBankas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div class="dashboard-layout">
        <!-- Šoninis meniu -->
       <aside class="sidebar-nav">
    <a href="index.html" style="text-decoration: none; color: inherit;">
        <div class="logo">Studijų<span>Bankas</span></div>
    </a>
    <nav id="main-nav">
        <a href="dashboard.html" id="nav-home"><i class="fas fa-home"></i> Pradžia</a>
        <a href="topics.html" id="nav-topics"><i class="fas fa-book"></i> Temos</a>
        <a href="quizzes.html" id="nav-quizzes"><i class="fas fa-vial"></i> Testai</a>
        <hr>
        <!-- Ši dalis bus keičiama dinamiškai per JS -->
        <div id="auth-section"></div>
    </nav>
</aside>

        <!-- Pagrindinis turinis -->
        <main class="dashboard-main">
            <header class="dash-header">
                <h2>Turinio valdymas</h2>
            </header>

            <!-- 1 SEKCIJA: Esamo turinio valdymas -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px;">
                <section>
                    <h3>Egzistuojančios pamokos</h3>
                    <div id="admin-topics-list" class="course-item" style="display: block; max-height: 300px; overflow-y: auto;">
                        <p>Kraunama...</p>
                    </div>
                </section>
                <section>
                    <h3>Egzistuojantys testai</h3>
                    <div id="admin-quizzes-list" class="course-item" style="display: block; max-height: 300px; overflow-y: auto;">
                        <p>Kraunama...</p>
                    </div>
                </section>
            </div>

            <hr style="margin-bottom: 30px; border: 0; border-top: 1px solid #eee;">

            <!-- 2 SEKCIJA: Pamokos forma -->
<h3 id="topic-form-title">Sukurti / Redaguoti pamoką</h3>
<div class="course-item" style="display: block; margin-bottom: 30px;">
    <form id="topicForm">
        <div class="input-group">
            <label>Pavadinimas</label>
            <input type="text" id="topicTitle" required>
        </div>

        <!-- PRIDĖTA: Pamokos kategorija -->
        <div class="input-group" style="margin-top: 10px;">
            <label>Kategorija</label>
            <select id="topicCategory" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; outline: none; cursor: pointer;">
                <option value="bendra">Bendra</option>
                <option value="Matematika">Matematika</option>
                <option value="Istorija">Istorija</option>
                <option value="Fizika">Fizika</option>
                <option value="Lietuvių kalba">Lietuvių kalba</option>
            </select>
        </div>

        <div class="input-group" style="margin-top: 10px;">
            <label>Trumpas aprašymas</label>
            <input type="text" id="topicDesc">
        </div>
        
        <div class="input-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label>Pamokos turinys (HTML/Tekstas)</label>
                <button type="button" onclick="insertImageTag()" class="btn-outline" style="padding: 2px 8px; font-size: 12px; margin-bottom: 5px;">
                    <i class="fas fa-image"></i> Įterpti nuotrauką
                </button>
            </div>
            <textarea id="topicContent" rows="10" style="width:100%; border-radius:10px; padding:10px; border:1px solid #ddd; font-family: monospace;"></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" class="btn-primary">Skelbti temą</button>
            <button type="button" onclick="resetTopicForm()" class="btn-outline" style="border: none;">Atšaukti</button>
        </div>
    </form>
</div>

<!-- 3 SEKCIJA: Testo forma -->
<h3 id="quiz-form-title">Sukurti / Redaguoti testą</h3>
<div class="course-item" style="display: block;">
    <form id="quizForm">
        <div class="input-group">
            <label>Testo pavadinimas</label>
            <input type="text" id="quizTitle" required>
        </div>

        <!-- PRIDĖTA: Testo kategorija -->
        <div class="input-group" style="margin-top: 10px;">
            <label>Kategorija</label>
            <select id="quizCategory" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; outline: none; cursor: pointer;">
                <option value="bendra">Bendra</option>
                <option value="Matematika">Matematika</option>
                <option value="Istorija">Istorija</option>
                <option value="Fizika">Fizika</option>
            </select>
        </div>

        <div class="input-group" style="margin-top: 10px;">
            <label>Trumpas testo aprašymas</label>
            <input type="text" id="quizDesc" required>
        </div>

        <div id="questions-container"></div>

        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button type="button" onclick="addQuestion()" class="btn-outline">Pridėti klausimą</button>
            <button type="submit" id="save-quiz-btn" class="btn-primary">Išsaugoti testą</button>
            <button type="button" onclick="resetQuizForm()" class="btn-outline" style="border: none;">Valyti</button>
        </div>
    </form>
</div>

    <!-- Bibliotekos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="admin.js"></script>
</body>
</html>
