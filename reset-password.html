<div class="reset-container">
    <h2>Sukurkite naują slaptažodį</h2>
    <input type="password" id="reset-new-password" placeholder="Naujas slaptažodis">
    <button id="save-new-password">Išsaugoti</button>
</div>

<script>
    document.getElementById('save-new-password').onclick = async () => {
        const newPass = document.getElementById('reset-new-password').value;
        
        const { data, error } = await supabaseClient.auth.updateUser({
            password: newPass
        });

        if (error) {
            alert("Klaida: " + error.message);
        } else {
            alert("Slaptažodis pakeistas! Galite prisijungti.");
            window.location.href = 'login.html';
        }
    };
</script>
