<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testas | StudijųBankas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">

    <div class="dashboard-layout">
        <!-- Šoninis meniu -->
         <aside class="sidebar-nav">
    <a href="index.html" style="text-decoration: none; color: inherit;">
        <div class="logo">Studijų<span>Bankas</span></div>
    </a>
    <nav id="main-nav">
        <a href="dashboard.html" id="nav-home"><i class="fas fa-home"></i> Pradžia</a>
        <a href="topics.html" id="nav-topics"><i class="fas fa-book"></i> Temos</a>
        <a href="quizzes.html" id="nav-quizzes"><i class="fas fa-vial"></i> Testai</a>
        <hr>
        <!-- Ši dalis bus keičiama dinamiškai per JS -->
        <div id="auth-section"></div>
    </nav>
</aside>

        <!-- Pagrindinis turinis -->
        <main class="dashboard-main">
            <header class="dash-header">
                <h2>Sveikas sugrįžęs, <span class="user-name">Moksleivi!</span></h2>
                <div class="premium-status">Planas: <b>Free</b> <a href="#">Upgrade</a></div>
            </header>

        <main class="dashboard-main">
            <header class="dash-header">
                <h2 id="quiz-title">Kraunamas testas...</h2>
                <div id="quiz-status" class="premium-status">Klausimų kiekis: --</div>
            </header>

            <!-- Naudojame ID, kuris sutampa su skriptu -->
            <div id="quiz-container" class="course-list">
                <p>Kraunama...</p>
            </div>

            <div id="quiz-result" style="margin-top: 20px; font-weight: bold; font-size: 1.2rem; color: #4a90e2; padding: 15px; border-radius: 10px; display: none; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05);"></div>
            
            <button id="submit-quiz" class="btn-primary" style="margin-top: 20px; width: 100%; max-width: 300px;">Pateikti atsakymus</button>
        </main>
    </div>

    <!-- Bibliotekos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="quiz.js"></script>
</body>
</html>
