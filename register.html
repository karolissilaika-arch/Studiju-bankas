<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registracija | StudijųBankas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5404880047208445"
     crossorigin="anonymous"></script>
</head>
<body class="auth-bg">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo">Studijų<span>Bankas</span></a>
                <h2>Sukurti paskyrą</h2>
                <p>Prisijunk prie tūkstančių besimokančių</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="input-group">
                    <label for="regName">Vardas</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="regName" placeholder="Jonas" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regEmail">El. paštas</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder="pavyzdys@mail.lt" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="regPassword">Slaptažodis</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPassword" placeholder="Min. 6 simboliai" required minlength="6">
                    </div>
                </div>

                <div class="input-group">
                    <label for="regPasswordConfirm">Pakartokite slaptažodį</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPasswordConfirm" placeholder="Pakartokite slaptažodį" required minlength="6">
                    </div>
                </div>

                <div id="reg-error" style="display:none; color:#e74c3c; font-size:14px; margin-bottom:12px; padding: 10px 14px; background:#fdedec; border-radius:8px;"></div>

                <button type="submit" class="btn-primary btn-full">Registruotis</button>
            </form>
               <div class="divider">
                <span>arba</span>
            </div>
             <div class="social-login">
                <button id="google-login-btn" class="google-btn">
                    <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google" width="18"> 
                    Prisijungti su Google
                </button>
            </div>

            <p class="auth-footer">
                Jau turite paskyrą? <a href="login.html">Prisijungti</a>
            </p>
            
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="subscription.js"></script>
</body>
</html>
