<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mano Skydelis | StudijųBankas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">

    <div class="dashboard-layout">
        <!-- Šoninis meniu -->
        <aside class="sidebar-nav">
            <div class="logo">Studijų<span>Bankas</span></div>
            <nav>
                <a href="#" class="active"><i class="fas fa-home"></i> Pradžia</a>
                <a href="#"><i class="fas fa-book"></i> Mano Kursai</a>
                <a href="#"><i class="fas fa-graduation-cap"></i> Egzaminai</a>
                <a href="#"><i class="fas fa-user-circle"></i> Profilis</a>
                <hr>
                <a href="index.html" class="logout"><i class="fas fa-sign-out-alt"></i> Atsijungti</a>
            </nav>
        </aside>

        <!-- Pagrindinis turinis -->
        <main class="dashboard-main">
            <header class="dash-header">
                <h2>Sveikas sugrįžęs, <span class="user-name">Moksleivi!</span></h2>
                <div class="premium-status">Planas: <b>Free</b> <a href="#">Upgrade</a></div>
            </header>

            <!-- Statstika -->
            <section class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-check-circle"></i>
                    <div>
                        <h4>Išmoktos temos</h4>
                        <p>12 / 45</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-fire"></i>
                    <div>
                        <h4>Mokymosi serija</h4>
                        <p>5 dienos</p>
                    </div>
                </div>
            </section>

            <!-- Temos -->
<h3>Tęsti mokymąsi</h3>
<div id="topics-list" class="course-list">
    <!-- Čia temos atsiras automatiškai -->
    <p>Kraunamos temos...</p>
</div>
<h2>Prieinami testai</h2>
<div id="quiz-list" class="courses-grid"></div>
    <!-- Testai atsiras čia -->
</div>

            <!-- Reklamos vieta (Free vartotojams) -->
            <div class="dash-ad">
                <p>Reklama: Gauk 20% nuolaidą kanceliarinėms prekėms!</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
