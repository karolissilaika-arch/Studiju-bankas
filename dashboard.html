<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mano Skydelis | StudijųBankas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div class="dashboard-layout">
        <aside class="sidebar-nav">
    <a href="index.html" style="text-decoration: none; color: inherit;">
        <div class="logo">Studijų<span>Bankas</span></div>
    </a>
    <nav id="main-nav">
        <a href="dashboard.html" id="nav-home" class="active"><i class="fas fa-home"></i> Pradžia</a>
        <a href="topics.html" id="nav-topics"><i class="fas fa-book"></i> Temos</a>
        <a href="quizzes.html" id="nav-quizzes"><i class="fas fa-vial"></i> Testai</a>
        <a href="exam-prep.html" id="nav-exams"><i class="fas fa-graduation-cap"></i> Egzaminai</a>
        <a href="vbe.html" id="nav-vbe"><i class="fas fa-star"></i> VBE Pasiruošimas</a>
        <a href="analytics.html" id="nav-analytics"><i class="fas fa-chart-bar"></i> Analitika</a>
        <a href="profile.html" id="nav-profile"><i class="fas fa-user"></i> Profilis</a>
        <hr>
        <div id="auth-section"></div>
    </nav>
</aside>

        <main class="dashboard-main">
            <header class="page-header">
                <div>
                    <h2>Statistika</h2>
                </div>
                <div id="user-header-info" onclick="window.location.href='profile.html'" class="user-header-pill">
                    <div>
                        <div id="header-username" class="pill-name">Moksleivis</div>
                        <small id="header-xp" class="pill-xp">0 XP</small>
                    </div>
                    <img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=1" alt="Profilis">
                </div>
            </header>

            <section class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-check-circle"></i>
                    <div>
                        <h4>Išmoktos temos</h4>
                        <p id="learned-topics-count">0 / 0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-fire"></i>
                    <div>
                        <h4>Mokymosi serija</h4>
                        <p>1 diena</p>
                    </div>
                </div>
            </section>

            <h3>Tęsti mokymąsi</h3>
            <div id="dashboard-topics">
                <p>Kraunama...</p>
            </div>

            <h3>Prieinami testai</h3>
            <div id="quiz-list">
                <p>Kraunama...</p>
            </div>

            <div class="dash-ad">
                <p>Reklama: Gauk 20% nuolaidą kanceliarinėms prekėms!</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="dashboard.js"></script>
    <script src="subscription.js"></script>
</body>
</html>
