<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBE Pasiruošimas | StudijųBankas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div class="dashboard-layout">
        <aside class="sidebar-nav">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <div class="logo">Studijų<span>Bankas</span></div>
            </a>
            <nav id="main-nav">
                <a href="dashboard.html" id="nav-home"><i class="fas fa-home"></i> Pradžia</a>
                <a href="topics.html" id="nav-topics"><i class="fas fa-book"></i> Temos</a>
                <a href="quizzes.html" id="nav-quizzes"><i class="fas fa-vial"></i> Testai</a>
                <a href="exam-prep.html" id="nav-exam"><i class="fas fa-graduation-cap"></i> Egzaminai</a>
                <a href="vbe.html" class="active"><i class="fas fa-star"></i> VBE Pasiruošimas</a>
                <a href="analytics.html" id="nav-analytics"><i class="fas fa-chart-bar"></i> Analitika</a>
                <a href="profile.html" id="nav-profile"><i class="fas fa-user"></i> Profilis</a>
                <hr>
                <div id="auth-section"></div>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="page-header">
                <div>
                    <h2>VBE Pasiruošimas</h2>
                    <p>Ruoškis valstybiniam brandos egzaminui</p>
                </div>
                <div id="user-header-info" onclick="window.location.href='profile.html'" class="user-header-pill">
                    <div>
                        <div id="header-username" class="pill-name">Kraunama...</div>
                        <small id="header-xp" class="pill-xp">0 XP</small>
                    </div>
                    <img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=1" alt="Profilis">
                </div>
            </header>

            <!-- Filtrai -->
            <div class="filter-bar">
                <select id="filter-subject" onchange="handleSubjectChange()" class="form-select">
                    <option value="all">Visi dalykai</option>
                </select>

                <select id="filter-topic" onchange="loadVbeQuestions()" class="form-select">
                    <option value="all">Visos temos</option>
                </select>

                <select id="filter-type" onchange="loadVbeQuestions()" class="form-select">
                    <option value="all">Visi tipai</option>
                    <option value="test">Testinis</option>
                    <option value="open">Laisvas atsakymas</option>
                </select>
            </div>

            <!-- Statistika -->
            <div id="vbe-stats" style="margin: 0 0 20px 0; color: #666; font-size: 15px;">
                Rasta klausimų: <strong id="vbe-q-count">0</strong>
            </div>

            <!-- Pradėti mygtukas -->
            <button id="start-vbe-btn" onclick="openVbePractice()" class="btn-start-practice">
                <i class="fas fa-play" style="margin-right: 10px;"></i> Pradėti VBE praktiką
            </button>

            <!-- Klausimų peržiūra -->
            <div id="vbe-questions-preview" style="display: none;">
                <h3 style="margin-bottom: 15px; color: #444;">Klausimų peržiūra</h3>
                <div id="vbe-preview-list"></div>
            </div>

            <!-- Tuščias pranešimas -->
            <div id="no-vbe-msg" class="empty-state">
                <i class="fas fa-graduation-cap"></i>
                <p>Pasirinkite filtrus, kad užkrautumėte VBE klausimus.</p>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="vbe.js"></script>
    <script src="subscription.js"></script>
</body>
</html>
