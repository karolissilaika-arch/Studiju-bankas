<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBE Praktika | StudijųBankas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div class="dashboard-layout">
        <aside class="sidebar-nav">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <div class="logo">Studijų<span>Bankas</span></div>
            </a>
            <nav id="main-nav">
                <a href="dashboard.html" id="nav-home"><i class="fas fa-home"></i> Pradžia</a>
                <a href="topics.html" id="nav-topics"><i class="fas fa-book"></i> Temos</a>
                <a href="quizzes.html" id="nav-quizzes"><i class="fas fa-vial"></i> Testai</a>
                <a href="exam-prep.html" id="nav-exam"><i class="fas fa-graduation-cap"></i> Egzaminai</a>
                <a href="vbe.html" class="active"><i class="fas fa-star"></i> VBE Pasiruošimas</a>
                <a href="analytics.html" id="nav-analytics"><i class="fas fa-chart-bar"></i> Analitika</a>
                <a href="profile.html" id="nav-profile"><i class="fas fa-user"></i> Profilis</a>
                <hr>
                <div id="auth-section"></div>
            </nav>
        </aside>

        <main class="dashboard-main">
            <header class="page-header">
                <div>
                    <a href="vbe.html" class="back-link"><i class="fas fa-arrow-left"></i> Grįžti į pasirinkimą</a>
                </div>
                <div id="user-header-info" onclick="window.location.href='profile.html'" class="user-header-pill">
                    <div>
                        <div id="header-username" class="pill-name">Kraunama...</div>
                        <small id="header-xp" class="pill-xp">0 XP</small>
                    </div>
                    <img id="header-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=1" alt="Profilis">
                </div>
            </header>

            <!-- Progreso juosta -->
            <div style="background: white; border-radius: 12px; padding: 15px 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 20px;">
                <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <span style="font-size: 13px; color: #666;">Progresas</span>
                        <span id="progress-text" style="font-size: 13px; font-weight: 600; color: #5d5fef;">0 / 0</span>
                    </div>
                    <div style="background: #f0f0f0; border-radius: 10px; height: 8px;">
                        <div id="progress-bar" style="background: linear-gradient(90deg, #5d5fef, #7c3aed); height: 8px; border-radius: 10px; width: 0%; transition: width 0.4s;"></div>
                    </div>
                </div>
                <div style="display: flex; gap: 15px; font-size: 14px;">
                    <span style="color: #27ae60; font-weight: 600;"><i class="fas fa-check"></i> <span id="correct-count">0</span></span>
                    <span style="color: #e74c3c; font-weight: 600;"><i class="fas fa-times"></i> <span id="wrong-count">0</span></span>
                </div>
            </div>

            <!-- Klausimo kortelė -->
            <div id="practice-container" style="max-width: 800px; margin: 0 auto;">
                <div id="active-question-card" style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.05); min-height: 450px; position: relative;">
                    <div id="active-question-container">
                        <div style="text-align: center; margin-top: 100px; color: #999;">
                            <i class="fas fa-spinner fa-spin" style="font-size: 30px; margin-bottom: 10px; display: block;"></i>
                            <p>Kraunami klausimai...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="vbe-practice.js"></script>
    <script src="subscription.js"></script>
</body>
</html>
