<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mano Profilis</title>
      <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div class="dashboard-layout">
        <aside class="sidebar-nav">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <div class="logo">Studijų<span>Bankas</span></div>
            </a>
            <nav id="main-nav">
                <a href="dashboard.html"><i class="fas fa-home"></i> Pradžia</a>
                <a href="topics.html"><i class="fas fa-book"></i> Temos</a>
                <a href="quizzes.html"><i class="fas fa-vial"></i> Testai</a>
                <a href="profile.html" class="active"><i class="fas fa-user"></i> Profilis</a>
                <hr>
                <div id="auth-section"></div>
            </nav>
        </aside>

        <main class="dashboard-main">
            <div class="container" style="max-width: 500px; margin: 40px auto;">
                <div class="course-item" style="display: block; text-align: center; padding: 30px; border-radius: 20px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                    
                    <div style="margin-bottom: 20px;">
                        <img id="user-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=1" alt="Profilis" 
                             style="width: 120px; height: 120px; border-radius: 50%; border: 4px solid #5d5fef; background: #f8f9ff; object-fit: cover;">
                    </div>

                    <h2 id="profile-name" style="margin: 0; color: #333; font-size: 24px;">Kraunama...</h2>
                    <p id="profile-email" style="color: #888; font-size: 14px; margin-top: 5px; margin-bottom: 25px;">Kraunama...</p>

                    <div style="display: flex; gap: 10px; margin-bottom: 30px;">
                        <div style="flex: 1; background: #f8f9ff; padding: 15px; border-radius: 12px;">
                            <h3 id="xp-count" style="margin: 0; font-size: 20px;">0</h3>
                            <p style="margin: 0; font-size: 10px; font-weight: bold; color: #aaa; text-transform: uppercase;">XP Taškai</p>
                        </div>
                        <div style="flex: 1; background: #f8f9ff; padding: 15px; border-radius: 12px;">
                            <h3 id="quizzes-count" style="margin: 0; font-size: 20px;">0</h3>
                            <p style="margin: 0; font-size: 10px; font-weight: bold; color: #aaa; text-transform: uppercase;">Testai</p>
                        </div>
                    </div>

                    <div style="text-align: left; border-top: 1px solid #f0f0f0; padding-top: 20px;">
                        <h4 style="margin-bottom: 15px; font-size: 16px; color: #333;"><i class="fas fa-lock" style="font-size: 12px;"></i> Atrakinami avatarai</h4>
                        <div id="avatar-gallery" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
                            </div>
                    </div>

                    <button onclick="window.location.href='dashboard.html'" class="btn-outline" style="margin-top: 30px; width: 100%;">
                        Grįžti į pradžią
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script> <script src="profile.js"></script>
</body>
</html>
