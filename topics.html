<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokymosi Temos | StudijųBankas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div class="dashboard-layout">
        <!-- Šoninis meniu (toks pat kaip kituose puslapiuose) -->
       <aside class="sidebar-nav">
    <div class="logo">Studijų<span>Bankas</span></div>
    <nav id="main-nav">
        <a href="dashboard.html" id="nav-home"><i class="fas fa-home"></i> Pradžia</a>
        <a href="topics.html" id="nav-topics"><i class="fas fa-book"></i> Temos</a>
        <a href="quizzes.html" id="nav-quizzes"><i class="fas fa-vial"></i> Testai</a>
        <hr>
        <!-- Ši dalis bus keičiama dinamiškai per JS -->
        <div id="auth-section"></div>
    </nav>
</aside>

        <main class="dashboard-main">
            <header class="dash-header">
                <div>
                    <h2>Mokymosi medžiaga</h2>
                    <p>Ieškokite temų ir gilinkite žinias</p>
                </div>
            </header>

            <!-- Paieškos ir filtravimo sekcija -->
            <div class="course-item" style="display: flex; gap: 15px; margin-bottom: 30px; align-items: center;">
                <div class="input-group" style="flex: 2; margin-bottom: 0;">
                    <input type="text" id="searchInput" placeholder="Ieškoti temos pagal pavadinimą..." style="width:100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
                </div>
                <div class="input-group" style="flex: 1; margin-bottom: 0;">
                    <select id="sortFilter" style="width:100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd;">
                        <option value="newest">Naujausi viršuje</option>
                        <option value="oldest">Seniausi viršuje</option>
                        <option value="az">A-Z</option>
                    </select>
                </div>
            </div>

            <!-- Temų sąrašas -->
            <div id="topics-container" class="topics-grid">
                <!-- Temos bus įkeliamos čia -->
                <div class="loader">Kraunamos temos...</div>
            </div>
        </main>
    </div>

    <!-- Bibliotekos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script>
        // Papildoma logika būtent šiam puslapiui
        document.addEventListener('DOMContentLoaded', () => {
            loadPublicTopics();
            setupSearch();
            updateSidebarAuth();
        });

  async function loadPublicTopics() {
    const { data, error } = await supabaseClient
    .from('topics')
    .select('*')
    .order('created_at', { ascending: false }); 

    if (error) {
        console.error("Išsami Supabase klaida:", error.message, error.details, error.hint);
        document.getElementById('topics-container').innerHTML = `Klaida: ${error.message}. Patikrinkite konsolę (F12).`;
        return;
    }
    renderTopics(data);
}

        function renderTopics(topics) {
            const container = document.getElementById('topics-container');
            if (topics.length === 0) {
                container.innerHTML = "<p>Temų nerasta.</p>";
                return;
            }

            container.innerHTML = topics.map(topic => `
                <div class="course-item topic-card" style="display: block; margin-bottom: 20px; transition: transform 0.2s;">
                    <div style="display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="toggleTopic(this)">
                        <div>
                            <h3 style="margin: 0; color: #333;">${topic.title}</h3>
                            <p style="margin: 5px 0 0; color: #666; font-size: 14px;">${topic.description || 'Nėra aprašymo'}</p>
                        </div>
                        <i class="fas fa-chevron-down arrow-icon"></i>
                    </div>
                    
                    <div class="topic-content" style="display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee;">
                        <div class="rich-text-content">
                            ${topic.content}
                        </div>
                        <div style="margin-top: 20px; text-align: right;">
                             <small style="color: #999;">Paskelbta: ${new Date(topic.created_at).toLocaleDateString('lt-LT')}</small>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleTopic(element) {
            const card = element.parentElement;
            const content = card.querySelector('.topic-content');
            const arrow = card.querySelector('.arrow-icon');
            
            if (content.style.display === 'none') {
                content.style.display = 'block';
                arrow.style.transform = 'rotate(180deg)';
                card.style.borderColor = 'var(--primary-color)';
            } else {
                content.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
                card.style.borderColor = 'transparent';
            }
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const sortFilter = document.getElementById('sortFilter');

            const filterData = async () => {
                const searchTerm = searchInput.value.toLowerCase();
                let { data: topics } = await supabaseClient.from('topics').select('*');

                // Filtruojame pagal paiešką
                let filtered = topics.filter(t => 
                    t.title.toLowerCase().includes(searchTerm) || 
                    (t.description && t.description.toLowerCase().includes(searchTerm))
                );

                // Rūšiuojame
                if (sortFilter.value === 'az') {
                    filtered.sort((a, b) => a.title.localeCompare(b.title));
                } else if (sortFilter.value === 'oldest') {
                    filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
                } else {
                    filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                }

                renderTopics(filtered);
            };

            searchInput.addEventListener('input', filterData);
            sortFilter.addEventListener('change', filterData);
        }

        function updateSidebarAuth() {
            const authLinks = document.getElementById('auth-links');
            // Čia paprasta logika: patikriname localStorage ar Supabase session
            const user = JSON.parse(localStorage.getItem('sb-user-session')); // Pavyzdys
            
            if (user) {
                authLinks.innerHTML = `<a href="index.html" class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Atsijungti</a>`;
            } else {
                authLinks.innerHTML = `<a href="login.html"><i class="fas fa-sign-in-alt"></i> Prisijungti</a>`;
            }
        }
    </script>

    <style>
        .topic-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .arrow-icon {
            transition: transform 0.3s ease;
            color: var(--primary-color);
        }
        .rich-text-content img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 15px 0;
        }
        .rich-text-content {
            line-height: 1.6;
            color: #444;
        }
    </style>
</body>
</html>
