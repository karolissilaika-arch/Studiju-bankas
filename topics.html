<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokymosi Temos | StudijųBankas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-bg">
    <div class="dashboard-layout">
        <!-- Šoninis meniu (toks pat kaip kituose puslapiuose) -->
        <aside class="sidebar-nav">
    <a href="index.html" style="text-decoration: none; color: inherit;">
        <div class="logo">Studijų<span>Bankas</span></div>
    </a>
    <nav id="main-nav">
        <a href="dashboard.html" id="nav-home"><i class="fas fa-home"></i> Pradžia</a>
        <a href="topics.html" id="nav-topics"><i class="fas fa-book"></i> Temos</a>
        <a href="quizzes.html" id="nav-quizzes"><i class="fas fa-vial"></i> Testai</a>
        <hr>
        <!-- Ši dalis bus keičiama dinamiškai per JS -->
        <div id="auth-section"></div>
    </nav>
</aside>

        <main class="dashboard-main">
            <header class="dash-header">
                <div>
                    <h2>Mokymosi medžiaga</h2>
                    <p>Ieškokite temų ir gilinkite žinias</p>
                </div>
            </header>

         
            <!-- NAUJA DALIS: Paieškos ir filtravimo juosta -->
            <div class="search-sort-bar" style="display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                <div style="flex: 1; min-width: 250px; position: relative;">
                    <i class="fas fa-search" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                    <input type="text" id="searchInput" placeholder="Ieškoti testo pagal pavadinimą..." style="width: 100%; padding: 12px 15px 12px 40px; border-radius: 8px; border: 1px solid #ddd; outline: none;">
                </div>
                
                <select id="category-filter" onchange="loadPublicTopics()" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; outline: none; min-width: 150px; cursor: pointer;">
                    <option value="all">Visos kategorijos</option>
                    <option value="Matematika">Matematika</option>
                    <option value="Istorija">Istorija</option>
                    <option value="Fizika">Fizika</option>
                </select>

                <select id="sortFilter" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; outline: none; min-width: 150px; cursor: pointer;">
                    <option value="newest">Naujausi viršuje</option>
                    <option value="az">A-Z</option>
                    <option value="oldest">Seniausi viršuje</option>
                </select>
            </div>

            <!-- Temų sąrašas -->
            <div id="topics-container" class="topics-grid">
                <!-- Temos bus įkeliamos čia -->
                <div class="loader">Kraunamos temos...</div>
            </div>
        </main>
    </div>

    <!-- Bibliotekos -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts.js"></script>
    <script src="topics.js"></script>
    <style>
        .topic-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .arrow-icon {
            transition: transform 0.3s ease;
            color: var(--primary-color);
        }
        .rich-text-content img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 15px 0;
        }
        .rich-text-content {
            line-height: 1.6;
            color: #444;
        }
    </style>
</body>
</html>
